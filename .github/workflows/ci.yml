name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: List schemes
        run: xcodebuild -list -project MyDailySoundtrack.xcodeproj
      - name: Validate scheme
        run: xcodebuild -list -project MyDailySoundtrack.xcodeproj | grep -q "MyDailySoundtrack"
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Select simulator
        run: |
          SIMULATOR_INFO="$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]*(iPhone [^()]*) \(([0-9A-F-]+)\) \(.*/\1|\2/p' | head -n 1)"
          if [ -z "$SIMULATOR_INFO" ]; then
            echo "No supported iPhone simulator found." >&2
            xcrun simctl list devices available
            exit 1
          fi
          SIMULATOR_NAME="${SIMULATOR_INFO%%|*}"
          SIMULATOR_UDID="${SIMULATOR_INFO##*|}"
          echo "SIMULATOR_NAME=${SIMULATOR_NAME}" >> "$GITHUB_ENV"
          echo "SIMULATOR_UDID=${SIMULATOR_UDID}" >> "$GITHUB_ENV"
          echo "Selected simulator: ${SIMULATOR_NAME} (${SIMULATOR_UDID})"
      - name: Validate simulator selection
        run: xcrun simctl list devices available | grep -q "${SIMULATOR_UDID}"
      - uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run tests
        run: bundle exec fastlane ios ci
